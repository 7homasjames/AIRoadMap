        - {p: Two Sum II – Input Array Is Sorted, slug: two-sum-ii-input-array-is-sorted, d: M}
        - {p: 3Sum, slug: 3sum, d: M}
        - {p: Container With Most Water, slug: container-with-most-water, d: M}
        - {p: Best Time to Buy and Sell Stock, slug: best-time-to-buy-and-sell-stock, d: E}
        - {p: Trapping Rain Water, slug: trapping-rain-water, d: H, kind: timed}
        - {p: 3Sum, slug: 3sum, d: M, kind: redo}
      - - {p: Longest Substring Without Repeating Characters, slug: longest-substring-without-repeating-characters, d: M}
        - {p: Longest Repeating Character Replacement, slug: longest-repeating-character-replacement, d: M}
        - {p: Permutation in String, slug: permutation-in-string, d: M}
        - {p: Minimum Size Subarray Sum, slug: minimum-size-subarray-sum, d: M}
        - {p: Sliding Window Maximum, slug: sliding-window-maximum, d: H}
        - {p: Minimum Window Substring, slug: minimum-window-substring, d: H, kind: timed}
        - {p: Longest Substring Without Repeating Characters, slug: longest-substring-without-repeating-characters, d: M, kind: redo}

  - name: Stacks & Binary Search
