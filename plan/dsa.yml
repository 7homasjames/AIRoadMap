# DSA track — the 1-hour daily LeetCode plan (mirrors dsa/SCHEDULE.md, NeetCode-style pattern order).
#
# Single source of truth for the website's DSA view. SEQUENCE-based like the
# main track: "today's problem" is the first entry whose notebook isn't in the repo.
#
# Each block = one pattern = one folder under dsa/. Each week lists 7 entries, Mon → Sun.
# Entry fields:
#   p:    problem title          slug: LeetCode URL slug        d: E | M | H
#   kind: new (default) | timed (Saturday, 45-min hard stop) | redo (Sunday, from scratch, no notes)
#   alt:  NeetCode slug for LeetCode-premium problems (free version on neetcode.io)
#   task: free-text entry instead of a specific problem (catch-up, mock interviews…)
#
# DONE detection (the site tells you the exact filename for today):
#   1st time a slug appears in the plan → dsa/<any-folder>/<slug>.ipynb   (or .py/.cpp)
#   2nd, 3rd… time (redos, timed repeats) → dsa/<any-folder>/<slug>--2.ipynb, --3, …
#   `task:` entries                     → dsa/<block-folder>/w<week>-<day>*   e.g. dsa/06-trees-2-heaps/w12-sun.md

blocks:
  - name: Arrays & Hashing
    folder: 01-arrays-hashing
    pos: [1, 0]
    weeks:
      - - {p: Contains Duplicate, slug: contains-duplicate, d: E}
        - {p: Valid Anagram, slug: valid-anagram, d: E}
        - {p: Two Sum, slug: two-sum, d: E}
        - {p: Group Anagrams, slug: group-anagrams, d: M}
        - {p: Top K Frequent Elements, slug: top-k-frequent-elements, d: M}
        - {p: Product of Array Except Self, slug: product-of-array-except-self, d: M, kind: timed}
        - {p: Two Sum, slug: two-sum, d: E, kind: redo}
      - - {p: Valid Sudoku, slug: valid-sudoku, d: M}
        - {p: Longest Consecutive Sequence, slug: longest-consecutive-sequence, d: M}
        - {p: Majority Element, slug: majority-element, d: E}
        - {p: Encode and Decode Strings, slug: encode-and-decode-strings, d: M, alt: string-encode-and-decode}
        - {p: Subarray Sum Equals K, slug: subarray-sum-equals-k, d: M}
        - {p: Product of Array Except Self, slug: product-of-array-except-self, d: M, kind: timed, note: aim faster than last week}
        - {p: Group Anagrams, slug: group-anagrams, d: M, kind: redo}

